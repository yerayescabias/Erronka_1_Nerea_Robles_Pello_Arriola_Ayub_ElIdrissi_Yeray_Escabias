name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto_ciberseguridad_laravel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Create environment file
        run: cp .env.example .env

      - name: Prepare application
        run: php artisan key:generate --force

      - name: Run tests
        run: php artisan test

  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto_ciberseguridad_laravel
    env:
      APP_ENV: testing
      APP_KEY: base64:VGhpc0lzQVN0YXRpY0tleUZvckdpdGh1YkFjdGlvbnM=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: cibereskola_test
      DB_USERNAME: root
      DB_PASSWORD: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: cibereskola_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Create environment file
        run: cp .env.example .env

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests against MySQL
        run: php artisan test